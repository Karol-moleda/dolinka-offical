# Buduje strone i wysyla ja na serwer vh.pl przez FTPS.
#
# Zastepuje reczne wrzucanie katalogu build/ FileZilla.
# Wysylane sa tylko pliki, ktore sie zmienily - stan zapamietuje plik
# .ftp-deploy-sync-state.json tworzony na serwerze przy pierwszym uruchomieniu.
#
# Wymagane sekrety repozytorium (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      host FTP z panelu vh.pl, np. ftp.dolinka.olkusz.pl
#   FTP_USERNAME    login FTP
#   FTP_PASSWORD    haslo FTP
#   FTP_SERVER_DIR  katalog strony na serwerze, ZAKONCZONY ukosnikiem,
#                   np. /domains/dolinka.olkusz.pl/public_html/

name: Deploy na vh.pl

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Proba bez wysylki - pokazuje co by poleclo, nic nie zmienia'
        type: boolean
        default: false

# Dwa deploye naraz moglyby sie wzajemnie nadpisac.
concurrency:
  group: deploy-vh
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zaleznosci
        # npm install zamiast npm ci: lokalny npm 12 zapisuje drzewo zaleznosci
        # inaczej niz npm dolaczony do starszego Node, przez co npm ci odmawial
        # (spory o ajv i json-schema-traverse). Node 22 = to samo co lokalnie.
        run: npm install --no-audit --no-fund

      - name: Zbuduj strone
        # Bylo tu `env: CI: false` - react-scripts przy CI=true traktowal
        # ostrzezenia eslinta jak bledy. Astro tego nie robi, wiec obejscie
        # jest juz niepotrzebne.
        #
        # Pierwsze budowanie po przesiadce trwa kilka minut: Astro generuje
        # miniatury i lzejsze warianty dla ponad dwustu zdjec z src/images.
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: npm run build

      - name: Sprawdz, czy build nie jest pusty
        run: |
          test -f dist/index.html || { echo "Brak dist/index.html - przerywam."; exit 1; }
          echo "Rozmiar wyniku: $(du -sh dist | cut -f1)"
          echo "Plikow: $(find dist -type f | wc -l)"

      - name: Wyslij na serwer vh.pl
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # ftps (szyfrowany) konczyl sie ECONNRESET na gniezdzie danych:
          # serwer ProFTPD na cPanelu wymaga wznowienia sesji TLS dla polaczenia
          # danych, czego biblioteka tej akcji nie negocjuje tak jak FileZilla.
          protocol: ftp
          timeout: 300000
          dry-run: ${{ inputs.dry_run == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
